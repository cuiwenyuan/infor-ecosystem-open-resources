site_name: Infor 产品生态系统导航站
site_url: https://yourusername.github.io/infor-ecosystem-nav/
repo_url: https://github.com/yourusername/infor-ecosystem-nav
repo_name: yourusername/infor-ecosystem-nav
edit_uri: edit/main/docs/

# 主题配置
theme:
  name: material
  language: zh
  palette:
    # 浅色主题
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到暗黑模式
    # 暗黑主题
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  logo: assets/images/logo.png
  favicon: assets/images/favicon.ico

# 插件配置
plugins:
  - search
  - sitemap:
      changefreq: weekly
      priority: 0.5
  - mkdocs-video

# 扩展配置
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - tables
  - fenced_code

# 自定义样式
extra_css:
  - assets/css/extra.css

# 自定义脚本
extra_javascript:
  - assets/js/extra.js

# 多语言支持（需要在 mkdocs.yml 同级目录创建 zh/ 和 en/ 配置）
# 使用 mkdocs-static-i18n 插件可实现更完善的多语言支持

# 额外信息
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/yourusername
  generator: false

# 导航结构
nav:
  - 首页: index.md
  - 产品分类:
      - 按业务功能: products/by-function/index.md
      - 按产品线: products/by-product-line/index.md
      - 按行业: products/by-industry/index.md
      - 按技术平台: products/by-platform/index.md
  - 产品详情:
      - products/details/infor-ln.md
      - products/details/infor-m3.md
      - products/details/cloudsuite-industrial.md
  - 生态系统: ecosystem/index.md
  - 关于: about.md
