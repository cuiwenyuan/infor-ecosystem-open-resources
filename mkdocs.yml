site_name: Infor 生态开放资源导航站
site_description: Infor 生态开放资源导航 - 收录全球 Infor 论坛、顾问公司、技术博客、开发工具等优质资源，为 Infor 用户、实施顾问和开发者提供一站式资源导航。
site_author: 崔文远 Troy Cui
site_url: https://cuiwenyuan.github.io/infor-ecosystem-open-resources/
repo_url: https://github.com/cuiwenyuan/infor-ecosystem-open-resources
repo_name: cuiwenyuan/infor-ecosystem-open-resources
edit_uri: edit/main/docs/
copyright: Copyright © 2026 崔文远 Troy Cui
theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/toggle-switch-off-outline
      name: 切换到深色模式
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/toggle-switch
      name: 切换到浅色模式
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.action.edit
  - content.action.view
  icon:
    logo: material/database-search
    repo: fontawesome/brands/github
plugins:
- search:
    lang:
    - zh
    - en
    separator: '[\s\-\.,:!?;\(\)\[\]{}\u3000\u3001\u3002\uff0c\uff01\uff1b\uff1a\u201c\u201d\u2018\u2019]'
markdown_extensions:
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- admonition
- pymdownx.details
- attr_list
- md_in_html
- def_list
- footnotes
- tables
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/cuiwenyuan
  - icon: fontawesome/brands/linkedin
    link: https://linkedin.com/
  generator: false
extra_css:
- assets/css/extra.css
