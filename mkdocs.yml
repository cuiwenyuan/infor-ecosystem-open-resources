site_name: Infor 生态第三方资源导航站
site_description: Infor 生态第三方资源导航 - 论坛、顾问公司、博客、工具等资源链接导航
site_author: Infor 生态社区
site_url: https://cuiwenyuan.github.io/infor-ecosystem-open-resources/

repo_url: https://github.com/cuiwenyuan/infor-ecosystem-open-resources
repo_name: cuiwenyuan/infor-ecosystem-open-resources
edit_uri: edit/main/docs/

copyright: Copyright © 2026 Infor 生态社区

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
  icon:
    logo: material/database-search
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cuiwenyuan
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX  # TODO: 替换为你的 Google Analytics ID

extra_css:
  - assets/css/extra.css

nav:
  - 首页: index.md
  - 论坛与社区: resources/forums.md
  - 顾问与实施公司: resources/consultants.md
  - 博客与教程: resources/blogs.md
  - 工具与插件: resources/tools.md
  - 培训与认证: resources/training.md
  - 按地区浏览:
      - 北美: by-region/north-america.md
      - 欧洲: by-region/europe.md
      - 亚太: by-region/asia-pacific.md
      - 中国: by-region/china.md
  - 按产品浏览:
      - Infor LN: by-product/ln.md
      - Infor M3: by-product/m3.md
      - CloudSuite Industrial: by-product/csi.md
      - Infor OS: by-product/infor-os.md
  - 产品分类:
      - 按业务功能: products/by-function/index.md
      - 按产品线: products/by-product-line/index.md
      - 按行业: products/by-industry/index.md
      - 按技术平台: products/by-platform/index.md
  - 关于本项目:
      - 项目介绍: about.md
      - 资源提交规范: submission-guide.md
      - 贡献指南: contributing.md
      - 联系我们: contact.md
